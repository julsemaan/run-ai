type: object
nullable: true
description: Complete enrolled-pool quotas from Kubernetes. Generation is metadata.generation, CPU is millicores and memory is decimal megabytes. No defaults are applied.
required: [epoch, kubernetesUid, generation, pools]
properties:
  epoch:
    type: string
    minLength: 1
  kubernetesUid:
    type: string
    minLength: 1
  generation:
    type: integer
    format: int64
    minimum: 1
  pools:
    type: array
    minItems: 1
    items:
      $ref: './QuotaSnapshotPool.yaml'
